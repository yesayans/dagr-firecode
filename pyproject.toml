[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aipm"
version = "0.1.0"
description = "AI Product Manager Assistant - discover hidden user needs from app reviews"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "streamlit>=1.33",
    "plotly>=5.20",
    "pyarrow>=15",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# UMAP gives materially better clusters than SVD but pulls in numba.
umap = ["umap-learn>=0.5.6"]
# Preferred local embedding backend. Heavy (torch); the pipeline falls back to
# TF-IDF -> TruncatedSVD automatically when it is absent.
local-embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aipm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
